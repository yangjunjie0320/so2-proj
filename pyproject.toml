[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so2-proj"
version = "0.1.0"
description = "Atomic partitions and SO(2) channels for molecular bond orders"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy>=2.2", "scipy>=1.15", "pyscf>=2.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
gpaw = ["gpaw==26.7.0"]

[tool.setuptools]
packages = ["so2_proj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpaw: real GPAW calculations (requires optional dependency and PAW datasets)"]
